name: vidforge

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: vidforge
      POSTGRES_USER: vidforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-local-secrets.mjs}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - vidforge-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vidforge -d vidforge']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?Run scripts/setup-local-secrets.mjs}']
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - vidforge-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vidforge-postgres:
  vidforge-redis:
